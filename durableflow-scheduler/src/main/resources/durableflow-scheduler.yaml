spring:
  application:
    name: durableflow-scheduler
  config:
    import: classpath:durableflow-persistence.yaml
server:
  port: 8081
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
