spring:
  datasource:
    url: ${DURABLEFLOW_DB_URL}
    username: ${DURABLEFLOW_DB_USER}
    password: ${DURABLEFLOW_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 5
        tcpKeepAlive: true
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
