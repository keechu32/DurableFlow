spring:
  application:
    name: durableflow-worker
  config:
    import: classpath:durableflow-persistence.yaml
server:
  port: 8082
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    json:
      exclude: [input, output, password, token, authorization, secret]
    format:
      console: ecs
